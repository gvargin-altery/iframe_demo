<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Iframe Test</title>
</head>
<body style="font-family: Arial; padding: 20px;">

  <h2>Iframe Test (Altery)</h2>

  <div style="margin-bottom: 10px;">
    <label>Session Token:</label><br />
    <input id="token" style="width: 400px;" />
  </div>

  <button onclick="sendToken()">Send Token</button>

  <hr />

  <iframe
    id="iframe"
    src="https://api.altery.com/v1/corporate-cards/iframe/97dff5a3-9bab-45fd-909d-5cf9abd68a46"
    width="800"
    height="600"
    style="border:1px solid #ccc;"
  ></iframe>

  <script>
    function sendToken() {
      const iframe = document.getElementById("iframe");
      const token = document.getElementById("token").value;

      iframe.contentWindow.postMessage(
        {
          type: "SET_SESSION_TOKEN",
          sessionToken: token
        },
        "https://api.altery.com"
      );

      console.log("Token sent");
    }

    window.addEventListener("message", (event) => {
      console.log("Message from iframe:", event.origin, event.data);
    });
  </script>

</body>
</html>
