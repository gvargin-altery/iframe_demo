<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Iframe Test — Altery</title>
</head>
<body style="font-family: Arial; padding: 20px;">

  <h2>Iframe Test (Altery)</h2>

  <div style="margin-bottom: 10px;">
    <label>Session Token:</label><br />
    <input id="token" type="password" autocomplete="off" style="width: min(400px, 90vw);" placeholder="Вставьте session token" />
  </div>

  <button id="send-token" type="button">Отправить токен</button>
  <p id="status" role="status" aria-live="polite">Ожидание токена. Сообщения iframe отображаются в консоли браузера.</p>

  <hr />

  <iframe
    id="iframe"
    src="https://api.altery.com/v1/corporate-cards/iframe/97dff5a3-9bab-45fd-909d-5cf9abd68a46/client/5541fdd3-ec54-4990-a959-2d06c3a6e54f"
    width="800"
    height="600"
    title="Altery corporate cards"
    style="width: min(800px, 100%); height: 600px; border: 1px solid #ccc;"
  ></iframe>

  <script>
    function sendToken() {
      const iframe = document.getElementById("iframe");
      const token = document.getElementById("token").value;

      if (!token.trim()) {
        document.getElementById("status").textContent = "Сначала вставьте session token.";
        return;
      }

      const targetOrigin = new URL(iframe.src).origin;

      iframe.contentWindow.postMessage(
        {
          type: "SET_SESSION_TOKEN",
          sessionToken: token
        },
        targetOrigin
      );

      document.getElementById("status").textContent = `Токен отправлен на ${targetOrigin}.`;
      console.log("Session token sent to:", targetOrigin);
    }

    document.getElementById("send-token").addEventListener("click", sendToken);

    window.addEventListener("message", (event) => {
      const iframe = document.getElementById("iframe");
      if (event.source !== iframe.contentWindow) return;
      console.log("Message from iframe:", event.origin, event.data);
    });
  </script>

</body>
</html>
